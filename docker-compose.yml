services:
  postgres:
    image: postgres:17
    container_name: mydatabases
    environment:
      POSTGRES_DB: labs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - user_app_postgres_data:/var/lib/postgresql/data

volumes:
  user_app_postgres_data:
  